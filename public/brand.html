<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VibeHub brand</title>
  <link rel="icon" href="/logo-mark-dark.svg">
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3;
           font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; padding: 40px; }
    h1 { font-weight: 800; } h2 { color: #8b949e; font-size: 14px; margin: 36px 0 12px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
    .swatch { border: 1px solid #30363d; border-radius: 12px; padding: 24px; }
    .swatch.light { background: #ffffff; }
    img.mark { display: block; }
  </style>
</head>
<body>
  <h1>⚡ VibeHub brand</h1>

  <h2>mascot — the Vibybara</h2>
  <img src="/vibybara.svg" width="480" alt="the Vibybara">

  <h2>full logo</h2>
  <img src="/logo.svg" width="560" alt="VibeHub logo">

  <h2>minimal mark (on dark / on light / small)</h2>
  <div class="row">
    <div class="swatch"><img class="mark" src="/logo-mark-dark.svg" width="120" alt=""></div>
    <div class="swatch light"><img class="mark" src="/logo-mark-light.svg" width="120" alt=""></div>
    <div class="swatch"><img class="mark" src="/logo-mark-dark.svg" width="32" alt=""></div>
    <div class="swatch light"><img class="mark" src="/logo-mark-light.svg" width="16" alt=""></div>
  </div>
</body>
</html>
